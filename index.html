<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <title>NIN DEFENDER</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#cc0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="NIN DEFENDER">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="css/styles.css?v=BUILD_VERSION">
    <link rel="icon" href="assets/icon-192.png">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="touchControls">
        <div id="joystickArea">
            <div id="joystickBase">
                <div id="joystickKnob"></div>
            </div>
        </div>
        <div id="fireButton">FIRE</div>
    </div>
    <div id="touchActions">
        <div id="shieldBtn" class="touch-action-btn">SHLD</div>
        <div id="bombBtn" class="touch-action-btn">BOMB</div>
        <div id="weaponBtn" class="touch-action-btn">WPN</div>
    </div>
    <div id="pauseBtn" class="hud-btn" title="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </div>
    <div id="muteBtn" class="hud-btn" title="Toggle Sound">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
            <path class="sound-on" d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path class="sound-off" d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
    </div>
    <div id="portraitWarning">
        <div class="rotate-icon">📱</div>
        <p>ROTATE YOUR DEVICE TO LANDSCAPE</p>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
